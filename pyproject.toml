# Project metadata for the Maniyamkode coffee farm monitoring app.
# Runtime deps are also listed here so `uv sync` (see README) installs everything.
[project]
name = "maniyamkode-coffee"
version = "0.1.0"
description = "Local-first farm monitoring app for the Maniyamkode (PUL) Robusta coffee estate, Wayanad, Kerala"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "rasterio>=1.3",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pillow>=10.0",
    "scipy>=1.12",
    "reportlab>=4.0",   # used by the NPOP inspection-pack PDF export
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
